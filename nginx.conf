server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSP estricto para producción (endurece la meta CSP de index.html).
    # Sin unsafe-inline/unsafe-eval en script-src. Conectividad solo al backend oficial.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://satisup.unipamplona.edu.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://satis-backend-xdhf9h:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        client_max_body_size 10M;
    }
}
