<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SAT Unipamplona - Acceso Institucional</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&amp;family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #0b1f4b; }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                "outline-variant": "#c5c6d0",
                "surface-tint": "#4c5d8c",
                "surface-dim": "#ced9ff",
                "background": "#faf8ff",
                "secondary-fixed": "#dbe1ff",
                "on-error": "#ffffff",
                "surface-container-high": "#e2e7ff",
                "tertiary-fixed": "#e2e3e1",
                "primary-fixed-dim": "#b4c5fb",
                "surface-container-low": "#f2f3ff",
                "surface-container": "#eaedff",
                "surface": "#faf8ff",
                "on-surface-variant": "#45464f",
                "surface-bright": "#faf8ff",
                "tertiary-fixed-dim": "#c6c7c5",
                "primary-container": "#0b1f4b",
                "on-secondary-container": "#fefcff",
                "surface-container-lowest": "#ffffff",
                "on-tertiary-fixed-variant": "#454746",
                "tertiary": "#090b0b",
                "on-tertiary": "#ffffff",
                "inverse-surface": "#1d2e5b",
                "primary-fixed": "#dae2ff",
                "surface-container-highest": "#dae2ff",
                "error": "#ba1a1a",
                "on-primary-fixed-variant": "#344573",
                "on-error-container": "#93000a",
                "on-primary": "#ffffff",
                "inverse-on-surface": "#eef0ff",
                "outline": "#757680",
                "on-secondary-fixed": "#00174b",
                "on-background": "#031945",
                "on-secondary-fixed-variant": "#003ea8",
                "on-primary-container": "#7788b9",
                "secondary-container": "#316bf3",
                "surface-variant": "#dae2ff",
                "on-tertiary-fixed": "#1a1c1b",
                "tertiary-container": "#202221",
                "on-surface": "#031945",
                "secondary-fixed-dim": "#b4c5ff",
                "on-primary-fixed": "#031945",
                "inverse-primary": "#b4c5fb",
                "primary": "#000926",
                "on-tertiary-container": "#888988",
                "secondary": "#0051d5",
                "on-secondary": "#ffffff",
                "error-container": "#ffdad6"
            },
            fontFamily: {
                "headline-md": ["Cormorant Garamond"],
                "display-xl": ["Cormorant Garamond"],
                "body-md": ["Space Grotesk"],
                "body-lg": ["Space Grotesk"],
                "headline-lg": ["Cormorant Garamond"],
                "technical-sm": ["Space Grotesk"],
                "label-caps": ["Space Grotesk"]
            },
            fontSize: {
                "headline-md": ["32px", { "lineHeight": "1.3", "fontWeight": "500" }],
                "display-xl": ["80px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                "headline-lg": ["48px", { "lineHeight": "1.2", "fontWeight": "500" }],
                "technical-sm": ["14px", { "lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500" }],
                "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" }]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-surface text-on-surface antialiased h-screen w-full flex flex-col overflow-hidden">
<!-- Main Split Layout -->
<main class="flex-1 flex w-full">
<!-- Left Panel: 60% Brutalist Editorial -->
<section class="hidden lg:flex w-[60%] border-r border-primary-container relative flex-col justify-between overflow-hidden bg-surface">

<!-- Custom Technical SVG Background Element -->
<img src="login.gif" alt="dashboard animation" style="width: 100%;">

</section>
<!-- Right Panel: 40% Precision Form -->
<section class="w-full lg:w-[40%] bg-surface-container-lowest flex flex-col justify-center px-8 lg:px-24 relative">
<div class="w-full max-w-sm mx-auto">
<!-- Institutional Header -->
<div class="mb-16">
<h2 class="font-headline-md text-headline-md text-primary-container mb-2">Acceso Institucional</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Ingrese sus credenciales académicas para acceder al sistema.</p>
</div>
<!-- Precision Form -->
<form class="space-y-8">
<!-- Email Field -->
<div class="relative group">
<label class="block font-technical-sm text-technical-sm text-primary-container mb-2 uppercase tracking-wide" for="email">Correo Institucional</label>
<div class="flex items-end border-b-2 border-primary-container focus-within:border-secondary transition-colors pb-2">
<input class="flex-1 bg-transparent border-none p-0 font-body-md text-body-md text-primary-container placeholder:text-outline focus:ring-0" id="email" name="email" placeholder="usuario" required="" type="text"/>
<span class="font-technical-sm text-technical-sm text-on-surface-variant pl-2 select-none">@unipamplona.edu.co</span>
</div>
</div>
<!-- Password Field -->
<div class="relative group">
<div class="flex justify-between items-baseline mb-2">
<label class="block font-technical-sm text-technical-sm text-primary-container uppercase tracking-wide" for="password">Contraseña</label>
<a class="font-technical-sm text-technical-sm text-secondary hover:underline decoration-secondary underline-offset-4" href="#">¿Olvidó su contraseña?</a>
</div>
<div class="flex items-end border-b-2 border-primary-container focus-within:border-secondary transition-colors pb-2">
<input class="flex-1 bg-transparent border-none p-0 font-body-md text-body-md text-primary-container placeholder:text-outline focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="text-primary-container hover:text-secondary transition-colors flex items-center justify-center p-1" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-8">
<button class="w-full bg-primary-container text-surface-container-lowest font-label-caps text-label-caps py-4 px-6 rounded-none uppercase tracking-[0.2em] hover:bg-secondary transition-all duration-300 ease-out flex items-center justify-center gap-3 group" type="submit">
<span>Ingresar al Sistema</span>
<span class="material-symbols-outlined text-[16px] transform group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</section>
</main>

</body></html>
